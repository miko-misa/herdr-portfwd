name: Feature request
description: Suggest a capability or a change in behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, or why the existing actions do not cover it.
