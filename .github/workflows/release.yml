name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: herdr-portfwd-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: herdr-portfwd-linux-aarch64
          - os: macos-15-intel
            asset: herdr-portfwd-darwin-x86_64
          - os: macos-15
            asset: herdr-portfwd-darwin-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage asset
        run: |
          mkdir -p dist
          cp target/release/herdr-portfwd "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true
      - name: Verify the tag matches the crate version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Checksums
        working-directory: staging
        run: |
          # scripts/install.sh looks each asset up in this file by name, so a
          # release missing one has to fail here rather than ship incomplete.
          test "$(ls herdr-portfwd-* | wc -l)" -eq 4 || {
            echo "expected 4 platform assets, found:" >&2; ls >&2; exit 1
          }
          sha256sum herdr-portfwd-* > SHA256SUMS
          cat SHA256SUMS
      # `gh` is preinstalled on the runner, so the release path carries no
      # third-party action and nothing to keep pinned.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/* --clobber
          else
            gh release create "$TAG" staging/* --title "$TAG" --generate-notes
          fi
