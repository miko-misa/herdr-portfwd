id = "portfwd"
name = "Herdr Port Forward"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Forward dev-server ports from remote Herdr hosts to your local machine"
platforms = ["macos", "linux"]

# Fetch the prebuilt herdr-portfwd binary for this platform into
# ./target/release/herdr-portfwd. Dev installs via `herdr plugin link` build
# with cargo themselves; link does not run build commands.
[[build]]
command = ["bash", "scripts/install.sh"]

# One-shot: reconcile recorded forwards against what is actually live, and drop
# records whose pane or host is gone. Not a daemon — it exits.
[[startup]]
command = ["./target/release/herdr-portfwd", "reconcile", "--startup"]

[[actions]]
id = "scan"
title = "Port: scan remote listeners"
description = "List remote ports that belong to a Herdr pane and forward the ones you pick"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-portfwd", "scan"]

[[actions]]
id = "add"
title = "Port: forward a port"
description = "Pick a remote port to forward to the same port locally"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-portfwd", "add"]

[[actions]]
id = "list"
title = "Port: manage forwards"
description = "Overlay of every live forward, with keys to stop them"
contexts = ["global"]
command = ["./target/release/herdr-portfwd", "pane-ui", "list"]

[[actions]]
id = "stop"
title = "Port: stop a forward"
description = "Pick a live forward and stop it"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-portfwd", "stop"]

[[actions]]
id = "stop-all"
title = "Port: stop all forwards for this host"
description = "Stop every forward belonging to the invoking host"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-portfwd", "stop-all"]

[[actions]]
id = "open-url"
title = "Port: confirm and forward"
description = "Confirm the clicked localhost URL, then forward and open it"
contexts = ["pane"]
command = ["./target/release/herdr-portfwd", "open-url"]

# Ctrl+click on a loopback URL forwards it and opens it locally instead of
# handing it to a browser that may be on the wrong machine. Deliberately
# restricted to loopback hosts: see SECURITY.md.
[[link_handlers]]
id = "loopback-url"
title = "Confirm this port forward"
pattern = "^https?://(?:localhost|127\\.0\\.0\\.1|\\[::1\\]):[0-9]{1,5}(?:[/?#].*)?$"
action = "open-url"

[[panes]]
id = "list"
title = "Port forwards"
description = "Live forwards, their owning panes, and stop keys"
placement = "overlay"
command = ["./target/release/herdr-portfwd", "pane-ui", "list"]

[[panes]]
id = "picker"
title = "Forward a port"
description = "Pick from attributed remote listeners"
placement = "popup"
width = "80%"
height = 20
command = ["./target/release/herdr-portfwd", "pane-ui", "picker"]

# Where a Ctrl+click lands. The state it renders — host, ports, whether the
# local port is free, the owning workspace and agent — arrives in the
# environment, because a pane command gets no arguments beyond this argv: see
# the module docs in src/confirm.rs.
#
# `height` is the *outer* popup, border included: Herdr spawns the pane command
# in `height - 2` rows (resolve_popup_geometry in its src/popup_size.rs). So
# this is ui::CONFIRM_HEIGHT + ui::POPUP_BORDER_ROWS, which a test in
# tests/cli.rs checks against this file. Declaring CONFIRM_HEIGHT itself gave
# the pane two rows fewer than the frame it has to hold, and the two it lost
# were `esc cancel` and the status line.
[[panes]]
id = "confirm"
title = "Forward a port"
description = "Say what a clicked localhost URL is about to do, and ask"
placement = "popup"
width = "70%"
height = 18
command = ["./target/release/herdr-portfwd", "pane-ui", "confirm"]

# Reconcile when attention moves to a different host, and release forwards owned
# by a pane that has gone away.
[[events]]
on = "workspace.focused"
command = ["./target/release/herdr-portfwd", "reconcile", "--event"]

[[events]]
on = "pane.exited"
command = ["./target/release/herdr-portfwd", "reconcile", "--event"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-portfwd", "reconcile", "--event"]
